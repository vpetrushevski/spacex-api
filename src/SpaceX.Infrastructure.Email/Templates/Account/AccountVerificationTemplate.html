<!DOCTYPE html>
<html lang="en" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="x-apple-disable-message-reformatting">
    <title>Verify your account</title>
    <link rel="icon" type="image/x-icon" href="https://www.hornetsecurity.com/app/themes/vdclassic/static/touchicons/favicon-32x32.png">

    <!--[if mso]>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
        <o:AllowPNG/>
      </o:OfficeDocumentSettings>
    </xml>
    <![endif]-->

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f8f9;
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        table {
            border-spacing: 0;
            border-collapse: collapse;
            mso-table-lspace: 0pt;
            mso-table-rspace: 0pt;
        }

        img {
            display: block;
            border: 0;
            outline: none;
            text-decoration: none;
            height: auto;
            -ms-interpolation-mode: bicubic;
        }

        p {
            margin: 0;
        }

        a {
            text-decoration: none;
        }

            a[x-apple-data-detectors],
            .unstyle-auto-detected-links a,
            .aBn {
                color: inherit !important;
                text-decoration: none !important;
                border-bottom: 0 !important;
                cursor: default !important;
            }

        @media screen and (max-width: 660px) {
            .container {
                width: 100% !important;
            }

            .content-padding {
                padding-left: 24px !important;
                padding-right: 24px !important;
            }

            .title {
                font-size: 26px !important;
                line-height: 32px !important;
            }
        }
    </style>
</head>

<body>
    <center style="width:100%; background-color:#f8f8f9;">
        <table width="100%" role="presentation" cellpadding="0" cellspacing="0" border="0" style="background-color:#f8f8f9;">
            <tr>
                <td align="center">

                    <!-- Top red bar -->
                    <table width="100%" role="presentation" cellpadding="0" cellspacing="0" border="0" style="background-color:#427fe1;">
                        <tr>
                            <td align="center">
                                <table class="container" width="640" role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:640px; max-width:640px; background-color:#427fe1;">
                                    <tr>
                                        <td style="height:4px; line-height:4px; font-size:4px;">&nbsp;</td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>

                    <!-- Small icon header -->
                    <table width="100%" role="presentation" cellpadding="0" cellspacing="0" border="0" style="background-color:#ffffff;">
                        <tr>
                            <td align="center">
                                <table class="container" width="640" role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:640px; max-width:640px; background-color:#ffffff;">
                                    <tr>
                                        <td align="center" style="padding:22px 0 25px 0;">
                                            <img src="https://www.hornetsecurity.com/app/themes/vdclassic/logo_pp_hse.png" width="40" alt="space-x-logo" title="space-x-logo" style="width:40px; max-width:40px;">
                                        </td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                    </table>

                    <!-- Spacer -->
                    <table class="container" width="640" role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:640px; max-width:640px; background-color:#f8f8f9;">
                        <tr>
                            <td style="height:40px; line-height:40px; font-size:40px;">&nbsp;</td>
                        </tr>
                    </table>

                    <!-- Main card -->
                    <table class="container" width="640" role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:640px; max-width:640px; background-color:#ffffff;">
                        <tr>
                            <td align="center" class="content-padding" style="padding:60px 40px 12px 40px;">
                                <img src="https://www.hornetsecurity.com/app/themes/vdclassic/logo_pp_hse.png" width="120" alt="space-x-logo" title="space-x-logo" style="width:120px; max-width:120px;">
                            </td>
                        </tr>

                        <tr>
                            <td class="content-padding" align="center" style="padding:50px 40px 10px 40px; font-family:Nunito, Arial, sans-serif;">
                                <h1 class="title" style="margin:0; color:#2b303a; font-size:30px; line-height:36px; font-weight:700;">
                                    Verify your account
                                </h1>
                            </td>
                        </tr>

                        <tr>
                            <td class="content-padding" align="center" style="padding:10px 40px 10px 40px; font-family:Nunito, Arial, sans-serif;">
                                <p style="margin:0; color:#808389; font-size:15px; line-height:23px;">
                                    @firstName @lastName, to activate your account, click the button below to verify your email address.
                                </p>
                            </td>
                        </tr>

                        <tr>
                            <td align="center" style="padding:15px 10px 0 10px;">
                                <!--[if mso]>
                                <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word" href="@verificationLink" style="height:62px;v-text-anchor:middle;width:260px;" arcsize="97%" strokecolor="#427fe1" fillcolor="#427fe1">
                                  <w:anchorlock/>
                                  <center style="color:#ffffff;font-family:Arial,sans-serif;font-size:16px;font-weight:bold;">
                                    Confirm your email address
                                  </center>
                                </v:roundrect>
                                <![endif]-->
                                <!--[if !mso]><!-- -->
                                <a href="@verificationLink" target="_blank" style="display:inline-block; background-color:#427fe1; color:#ffffff; border-radius:60px; padding:15px 30px; font-family:Nunito, Arial, sans-serif; font-size:16px; line-height:32px; font-weight:700; text-align:center;">
                                    Confirm your email address
                                </a>
                                <!--<![endif]-->
                            </td>
                        </tr>

                        <tr>
                            <td style="height:72px; line-height:72px; font-size:72px;">&nbsp;</td>
                        </tr>
                    </table>

                    <!-- Spacer -->
                    <table class="container" width="640" role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:640px; max-width:640px; background-color:#f8f8f9;">
                        <tr>
                            <td style="height:40px; line-height:40px; font-size:40px;">&nbsp;</td>
                        </tr>
                    </table>

                    <!-- Footer -->
                    <table class="container" width="640" role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:640px; max-width:640px; background-color:#427fe1;">
                        <tr>
                            <td style="height:4px; line-height:4px; font-size:4px;">&nbsp;</td>
                        </tr>
                        <tr>
                            <td style="padding:25px 40px 10px 40px;">
                                <table width="100%" role="presentation" cellpadding="0" cellspacing="0" border="0">
                                    <tr>
                                        <td style="border-top:1px solid #ffffff; height:1px; line-height:1px; font-size:1px;">&nbsp;</td>
                                    </tr>
                                </table>
                            </td>
                        </tr>
                        <tr>
                            <td style="padding:20px 40px 30px 40px; font-family:Nunito, Arial, sans-serif;">
                                <p style="margin:0; color:#ffffff; font-size:12px; line-height:16px;">
                                    Space X Copyright © 2026. All rights reserved.
                                </p>
                            </td>
                        </tr>
                    </table>

                </td>
            </tr>
        </table>
    </center>
</body>
</html>
